name: t4f-performance-lab
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER em backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure uma senha local aleatoria em backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-t4f_lab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-t4f_lab}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","https://thiago-code-lab.github.io"]}
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-demo && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    restart: unless-stopped
volumes:
  postgres_data:
