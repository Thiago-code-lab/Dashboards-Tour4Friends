[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_connected_tests.py" = ["E402"] # Bootstrap the app package when invoked from repository root.
"tests/conftest.py" = ["E402"] # Validate and select the disposable database before importing the app.
"tests/test_api.py" = ["ASYNC240"] # Read the small, immutable seed fixture in the test process.
