name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/backend-postgresql-v1, feature/advanced-analytics-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - name: Backend lint
        run: python -m ruff check backend/app backend/tests backend/scripts
      - name: Start disposable PostgreSQL with an ephemeral password
        shell: bash
        run: |
          T4F_DB_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$T4F_DB_PASSWORD"
          echo "POSTGRES_PASSWORD=$T4F_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://t4f_ci:$T4F_DB_PASSWORD@127.0.0.1:55432/t4f_lab_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://t4f_ci:$T4F_DB_PASSWORD@127.0.0.1:55432/t4f_lab_test" >> "$GITHUB_ENV"
          docker run -d --name t4f-postgres -e POSTGRES_USER=t4f_ci -e POSTGRES_DB=t4f_lab_test -e POSTGRES_PASSWORD="$T4F_DB_PASSWORD" -p 127.0.0.1:55432:5432 postgres:18
          for attempt in $(seq 1 30); do
            if docker exec t4f-postgres pg_isready -U t4f_ci -d t4f_lab_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: PostgreSQL migrations, API, security, persistence and KPI parity
        working-directory: backend
        run: python -m pytest -q
      - run: npx playwright install --with-deps chromium
      - name: Connected browser tests with real API and PostgreSQL
        run: python backend/scripts/run_connected_tests.py --allow-reset-test-db
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-interface-failure
          path: |
            artifacts/connected-services.log
            test-results/
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f t4f-postgres
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_MODE: demo
      VITE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Audit development and runtime dependencies
        run: npm audit --audit-level=moderate
      - name: Verify reproducible demo
        run: |
          python scripts/generate_demo_data.py
          git diff --exit-code -- public/data/demo.json
      - run: npm run data:validate
      - run: npm test
      - name: Reproduce advanced analytical results
        run: npm run analytics:report
      - run: npm run build:demo
      - name: Check static artifacts for credentials
        run: npx tsx scripts/check-artifacts.ts
      - name: Verify the static release package
        run: npm run release:check
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install browser for interface tests
        run: npx playwright install --with-deps chromium
      - name: Interface tests on production build
        run: npm run test:e2e
        env:
          CI: true
      - name: Six-resolution audit of ten modules
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4175 --strictPort > /tmp/t4f-preview.log 2>&1 &
          T4F_PREVIEW_PID=$!
          trap 'kill "$T4F_PREVIEW_PID" || true' EXIT
          npm run qa:audit
          npm run delivery:data
          python -m pip install -r scripts/requirements-delivery.txt
          python scripts/build-academic-report.py
          if ! command -v pdftoppm >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y poppler-utils; fi
          pdftoppm -scale-to 1100 -png output/pdf/T4F-Performance-Projeto-Integrador-V-Entrega.pdf artifacts/qa-final/pdf-page
        env:
          CI: true
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-failure
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: analytical-evidence
          retention-days: 7
          path: |
            artifacts/analytics-*.png
            artifacts/analytics-report.pdf
            artifacts/analytics-results.json
            artifacts/qa-final/
            artifacts/release-05/
            output/pdf/T4F-Performance-Projeto-Integrador-V-Entrega.pdf
            output/pdf/T4F-Performance-Projeto-Integrador-V-Entrega.manifest.json
      - name: Upload static candidate for review without deployment
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-candidate-static
          retention-days: 14
          path: |
            dist/
            artifacts/release-05/static-package.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
